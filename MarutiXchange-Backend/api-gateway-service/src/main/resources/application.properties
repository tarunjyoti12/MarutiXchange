# ===============================
# SERVER CONFIG
# ===============================
server.port=8064
spring.application.name=api-gateway-service

# ===============================
# EUREKA CONFIG
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ===============================
# GATEWAY ROUTES
# ===============================

# USER SERVICE
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**
spring.cloud.gateway.routes[0].filters[0]=JwtAuthenticationFilter

# CAR LISTING SERVICE
spring.cloud.gateway.routes[1].id=car-listing-service
spring.cloud.gateway.routes[1].uri=lb://CAR-LISTING-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/listings/**,/api/v1/search/**,/api/v1/analytics/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthenticationFilter

# BIDDING SERVICE
spring.cloud.gateway.routes[2].id=bidding-service
spring.cloud.gateway.routes[2].uri=lb://BIDDING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/bids/**,/api/v1/auctions/**,/api/v1/chat/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthenticationFilter

# ORDER SERVICE
spring.cloud.gateway.routes[3].id=order-service
spring.cloud.gateway.routes[3].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthenticationFilter

# PAYMENT SERVICE
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/payments/**,/api/v1/escrow/**,/api/v1/refunds/**
spring.cloud.gateway.routes[4].filters[0]=JwtAuthenticationFilter

# NOTIFICATION SERVICE
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[5].filters[0]=JwtAuthenticationFilter

# TEST DRIVE SERVICE
spring.cloud.gateway.routes[6].id=test-drive-service
spring.cloud.gateway.routes[6].uri=lb://TEST-DRIVE-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/test-drives/**,/api/v1/slots/**
spring.cloud.gateway.routes[6].filters[0]=JwtAuthenticationFilter

# RULES ENGINE SERVICE (internal, no JWT needed)
spring.cloud.gateway.routes[7].id=rules-engine-service
spring.cloud.gateway.routes[7].uri=lb://RULES-ENGINE-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/rules/**

# ===============================
# JWT CONFIG
# ===============================
app.jwt.secret=${JWT_SECRET:dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
