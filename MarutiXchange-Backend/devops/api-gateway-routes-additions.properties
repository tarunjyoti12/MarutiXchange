# =============================================
# ADD TO: api-gateway-service/application.properties
# New routes for rc-transfer-service and watchlist-service
# =============================================

# RC TRANSFER SERVICE
spring.cloud.gateway.routes[8].id=rc-transfer-service
spring.cloud.gateway.routes[8].uri=lb://RC-TRANSFER-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/rc-transfers/**
spring.cloud.gateway.routes[8].filters[0]=JwtAuthenticationFilter

# WATCHLIST SERVICE
spring.cloud.gateway.routes[9].id=watchlist-service
spring.cloud.gateway.routes[9].uri=lb://WATCHLIST-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/watchlist/**
spring.cloud.gateway.routes[9].filters[0]=JwtAuthenticationFilter
