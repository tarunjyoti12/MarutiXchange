      - mx-network

  ar-visualizer-service:
    build:
      context: ../ar-visualizer-service
      dockerfile: Dockerfile
    container_name: mx-ar
    restart: unless-stopped
    ports:
      - "8076:8076"
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      EUREKA_HOST: mx-discovery
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      REDIS_HOST: mx-redis
      REDIS_PORT: 6379
