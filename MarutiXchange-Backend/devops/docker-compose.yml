  rc-transfer-service:
    build:
      context: ../rc-transfer-service
      dockerfile: Dockerfile
    container_name: mx-rctransfer
    restart: unless-stopped
    ports:
      - "8075:8075"
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}
      EUREKA_HOST: mx-discovery
