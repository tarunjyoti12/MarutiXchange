  frontend:
    build:
      context: ../../MarutiXchange-Frontend/Frontend
      dockerfile: Dockerfile
    container_name: mx-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-gateway-service
    networks:
