version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      MYSQL_DATABASE: marutixchange_users
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mx-network

  redis:
    image: redis:7.2-alpine
    container_name: mx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mx-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: mx-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - mx-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mx-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - mx-network

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mx-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --create --if-not-exists --topic notification-events --partitions 5 --replication-factor 1 --bootstrap-server kafka:29092 &&
        kafka-topics --create --if-not-exists --topic bid-events          --partitions 5 --replication-factor 1 --bootstrap-server kafka:29092 &&
        kafka-topics --create --if-not-exists --topic auction-events      --partitions 5 --replication-factor 1 --bootstrap-server kafka:29092 &&
        kafka-topics --create --if-not-exists --topic payment-events      --partitions 5 --replication-factor 1 --bootstrap-server kafka:29092 &&
        kafka-topics --create --if-not-exists --topic test-drive-events   --partitions 5 --replication-factor 1 --bootstrap-server kafka:29092 &&
        kafka-topics --create --if-not-exists --topic rc-transfer-events  --partitions 3 --replication-factor 1 --bootstrap-server kafka:29092 &&
        echo 'All Kafka topics created successfully'
      "
    networks:
      - mx-network

  discovery-service:
    build:
      context: ../discovery-service
      dockerfile: Dockerfile
    container_name: mx-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      EUREKA_HOST: mx-discovery
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - mx-network

  api-gateway-service:
    build:
      context: ../api-gateway-service
      dockerfile: Dockerfile
    container_name: mx-gateway
    restart: unless-stopped
    ports:
      - "8064:8064"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}
      EUREKA_HOST: mx-discovery
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - mx-network

  rules-engine-service:
    build:
      context: ../rules-engine-service
      dockerfile: Dockerfile
    container_name: mx-rules
    restart: unless-stopped
    ports:
      - "8069:8069"
    environment:
      EUREKA_HOST: mx-discovery
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - mx-network

  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: mx-user
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}
      EUREKA_HOST: mx-discovery
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      REDIS_HOST: mx-redis
      REDIS_PORT: 6379
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - mx-network

  car-listing-service:
    build:
      context: ../car-listing-service
      dockerfile: Dockerfile
    container_name: mx-car-listing
    restart: unless-stopped
    ports:
      - "8068:8068"
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}
      EUREKA_HOST: mx-discovery
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      REDIS_HOST: mx-redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - mx-network

  bidding-service:
    build:
      context: ../bidding-service
      dockerfile: Dockerfile
    container_name: mx-bidding
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}
      EUREKA_HOST: mx-discovery
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      REDIS_HOST: mx-redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - mx-network

  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: mx-notification
    restart: unless-stopped
    ports:
      - "8051:8051"
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}
      EUREKA_HOST: mx-discovery
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - mx-network

  order-service:
    build:
      context: ../order-service
      dockerfile: Dockerfile
    container_name: mx-order
    restart: unless-stopped
    ports:
      - "8066:8066"
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}
      EUREKA_HOST: mx-discovery
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - mx-network

  payment-service:
    build:
      context: ../payment-service
      dockerfile: Dockerfile
    container_name: mx-payment
    restart: unless-stopped
    ports:
      - "8092:8092"
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}
      EUREKA_HOST: mx-discovery
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_your_key_here}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-your_razorpay_secret_here}
    depends_on:
      mysql:
        condition: service_healthy
