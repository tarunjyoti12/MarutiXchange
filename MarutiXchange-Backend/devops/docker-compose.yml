  watchlist-service:
    build:
      context: ../watchlist-service
      dockerfile: Dockerfile
    container_name: mx-watchlist
    restart: unless-stopped
    ports:
      - "8077:8077"
    environment:
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}
      EUREKA_HOST: mx-discovery
      EUREKA_USERNAME: ${EUREKA_USERNAME:-admin}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-admin123}
      REDIS_HOST: mx-redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
