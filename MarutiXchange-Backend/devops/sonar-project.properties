# =============================================
# MarutiXchange — SonarQube Configuration
# Place in each service's root directory
# =============================================
sonar.host.url=http://localhost:9000
sonar.login=${SONAR_TOKEN}

# Quality Gate — aligned with Qualys VAPT requirements
sonar.qualitygate.wait=true

# Coverage thresholds
sonar.coverage.exclusions=**/dto/**,**/entity/**,**/exception/**,**/config/**,**/*Application.java

# Security hotspot categories to track
sonar.security.sources.java.provider=java
