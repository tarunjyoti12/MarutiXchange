# =============================================
# MarutiXchange - Order Service
# =============================================
spring.application.name=order-service
server.port=8066

# =============================================
# MySQL
# =============================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/marutixchange_orders?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# Eureka
# =============================================
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD:admin123}@${EUREKA_HOST:localhost}:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =============================================
# JWT
# =============================================
app.jwt.secret=${JWT_SECRET:dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}
app.jwt.expiration-ms=86400000

# =============================================
# Inter-service URLs
# =============================================
app.services.car-listing-url=http://localhost:8068
app.services.notification-url=http://localhost:8051
app.services.payment-url=http://localhost:8092

# =============================================
# Swagger
# =============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =============================================
# Logging
# =============================================
logging.level.com.marutixchange=INFO
logging.level.org.springframework.security=WARN
