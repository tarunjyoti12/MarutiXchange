# Test profile
spring.profiles.active=test

spring.application.name=payment-service
server.port=8087

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=marutixchange-super-secret-key-must-be-256-bits-long-for-hs256
app.jwt.expiration-ms=86400000

app.payment.token.amount=10000
app.payment.timeout.minutes=30
app.payment.refund.free-window-hours=48
app.payment.refund.cancellation-fee-percent=10
app.payment.fraud.max-amount=10000000
app.payment.fraud.max-attempts=5

# ? RULE ENGINE (FIXED)
app.rule-engine.url=http://localhost:8069/api/rules/evaluate
app.rule-engine.timeout-ms=5000
app.rule-engine.retry-attempts=3
app.rule-engine.enabled=true

eureka.client.enabled=false

springdoc.swagger-ui.enabled=false

logging.level.com.marutixchange=INFO
logging.level.org.springframework.security=WARN
logging.level.root=WARN