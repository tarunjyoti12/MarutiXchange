# =============================================
# MarutiXchange - Payment Service
# =============================================
spring.application.name=payment-service
server.port=8092

# =============================================
# MySQL
# =============================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/marutixchange_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# JWT
# =============================================
app.jwt.secret=${JWT_SECRET:dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}
app.jwt.expiration-ms=86400000

# =============================================
# Payment Business Rules
# =============================================
app.payment.token.amount=10000
app.payment.timeout.minutes=30
app.payment.refund.free-window-hours=48
app.payment.refund.cancellation-fee-percent=10
app.payment.fraud.max-amount=10000000
app.payment.fraud.max-attempts=5

# =============================================
# Razorpay
# Get from: https://dashboard.razorpay.com -> Settings -> API Keys
# =============================================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_your_key_here}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_secret_here}
app.frontend.url=http://localhost:5173

# =============================================
# Rule Engine
# =============================================
app.rule-engine.url=http://localhost:8069/rules/evaluate
app.rule-engine.timeout-ms=5000
app.rule-engine.retry-attempts=3
app.rule-engine.enabled=true

# =============================================
# Swagger
# =============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# =============================================
# Eureka
# =============================================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD:admin123}@${EUREKA_HOST:localhost}:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.client.registry-fetch-interval-seconds=30

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =============================================
# Logging
# =============================================
logging.level.com.marutixchange=INFO
logging.level.org.springframework.security=WARN
logging.level.com.netflix.discovery=WARN
logging.level.com.netflix.eureka=WARN

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# =============================================
# Kafka
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

kafka.topics.notification-events=notification-events
kafka.topics.payment-events=payment-events
kafka.topics.test-drive-events=test-drive-events
