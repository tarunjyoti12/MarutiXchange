# =============================================
# MarutiXchange - RC Transfer Service
# =============================================
spring.application.name=rc-transfer-service
server.port=8075

# =============================================
# MySQL
# =============================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/marutixchange_rctransfer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# JWT
# =============================================
app.jwt.secret=${JWT_SECRET:dev-local-only-secret-change-in-prod-must-be-min-256-bits-0123456789}
app.jwt.expiration-ms=86400000

# =============================================
# Eureka
# =============================================
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD:admin123}@${EUREKA_HOST:localhost}:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =============================================
# Inter-Service URLs
# =============================================
app.services.user-service-url=http://localhost:8081
app.services.car-listing-url=http://localhost:8068
app.services.notification-service-url=http://localhost:8051

# =============================================
# Kafka
# =============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
kafka.topics.notification-events=notification-events

# =============================================
# RC Transfer Business Rules
# =============================================
app.rctransfer.document-expiry-days=90
app.rctransfer.max-pending-per-user=3

# =============================================
# File Upload
# =============================================
app.upload.dir=uploads/rc-documents
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# =============================================
# Swagger
# =============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =============================================
# Logging
# =============================================
logging.level.com.marutixchange=INFO
logging.level.org.springframework.security=WARN
